name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fincontrol_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fincontrol_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fincontrol_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fincontrol_test?schema=public
      APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: integration-test-secret-with-at-least-32-characters
      STORAGE_DRIVER: vercel-blob
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_placeholder
      EMAIL_DRIVER: resend
      RESEND_API_KEY: re_ci_placeholder
      CRON_SECRET: integration-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
